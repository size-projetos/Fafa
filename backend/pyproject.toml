[project]
name = "fafa"
version = "0.1.0"
description = "Fafa - assistente tecnico da SIZE Engenharia Ambiental"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Daniel Broleis" }]

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
geo = ["pyproj>=3.6"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
docs = ["python-docx>=1.1"]
voz = ["sounddevice>=0.4.6", "numpy>=1.26", "pyttsx3>=2.90"]
visao = ["Pillow>=10.0", "opencv-python-headless>=4.9", "PyMuPDF>=1.24", "mss>=9.0"]
audio_diag = ["pycaw>=20240210"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = [
    "pyproj>=3.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pyttsx3>=2.90",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "PyMuPDF>=1.24",
    "mss>=9.0",
]

[project.scripts]
fafa = "fafa.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
